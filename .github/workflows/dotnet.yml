name: Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test --configuration Release

    # The schemas are generated from the same constants the validator enforces, so a committed copy
    # can fall behind them silently. Regenerating and diffing is what keeps the published contract
    # honest now that editors and language models are pointed at the file rather than the command.
    - name: Check committed schemas match the validator
      run: |
        set -euo pipefail
        fail() { echo "::error::schema/$1 is stale; regenerate it with --describe-schema $2"; exit 1; }
        dotnet run --project NEMSweep.CLI -c Release -- --describe-schema scenario > scenario.actual.json
        dotnet run --project NEMSweep.CLI -c Release -- --describe-schema sweep > sweep.actual.json
        diff -u schema/scenario-v6.json scenario.actual.json || fail scenario-v6.json scenario
        diff -u schema/sweep-v1.json sweep.actual.json || fail sweep-v1.json sweep

    # Packing on every change, and throwing the packages away, is what stops a packaging break
    # being discovered only when a release tag is pushed. Nothing is published from here.
    - name: Pack
      run: dotnet pack --configuration Release --output ${{ runner.temp }}/packages

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools
      run: dotnet tool restore

    # Fails on a broken cross-reference or a TOC entry with no page behind it, so the docs site
    # cannot ship a dead link. Cloudflare Pages runs docs/build.sh, which invokes the same command.
    - name: Build documentation site
      run: dotnet docfx docs/docfx.json --warningsAsErrors

  # The image is described entirely by NEMSweep.CLI.csproj, so there is no Dockerfile to drift and
  # no daemon in the build. Building it and throwing it away is enough to catch a broken image.
  #
  # Split from the job below because a workflow triggered by a pull request runs the definition on
  # the pull request's branch: any write scope granted here is a scope a proposed change could spend.
  # This job therefore only ever reads.
  container:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build image
      run: >
        dotnet publish NEMSweep.CLI/NEMSweep.CLI.csproj -c Release --os linux --arch x64
        -t:PublishContainer
        -p:ContainerArchiveOutputPath=${{ runner.temp }}/nemsweep.tar.gz

  # Only a push to main reaches this job, so `packages: write` is only ever held by a workflow
  # definition that is already on main. Registry authentication is the job's own GITHUB_TOKEN, not
  # OIDC, so no identity token is asked for either.
  publish-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Multi-architecture needs a registry: the SDK can write a single-architecture image to a local
    # archive, but composing the image index requires somewhere to push the manifests.
    - name: Publish image
      run: >
        dotnet publish NEMSweep.CLI/NEMSweep.CLI.csproj -c Release
        -t:PublishContainer
        -p:ContainerRegistry=ghcr.io
        -p:ContainerRepository=${{ github.repository_owner }}/nemsweep
        -p:ContainerImageTags='"latest;${{ github.sha }}"'

  # A release is a `v*` tag, and the tag names the version: nothing in the tree records it, so
  # cutting a release is a tag push and no commit.
  #
  # NuGet trusted publishing exchanges this job's short-lived GitHub OIDC token for a temporary
  # one-hour NuGet API key. Register a NuGet trusted-publishing policy for this repository and
  # workflow file (`dotnet.yml`), restricted to the `nuget` environment. The environment retains
  # required reviewers and a deployment branch rule for release tags, so a tag alone cannot publish.
  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, docs]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pack at the tagged version
      env:
        CI: 'true'
      run: |
        set -euo pipefail
        version="${GITHUB_REF_NAME#v}"
        dotnet pack --configuration Release -p:Version="$version" --output "${{ runner.temp }}/packages"

    - name: Log in to NuGet with trusted publishing
      uses: NuGet/login@v1
      id: nuget-login
      with:
        # This is the NuGet.org profile name, not an email address or API key.
        user: ${{ secrets.NUGET_USER }}

    # --skip-duplicate so re-running the job after a partial failure pushes only what is missing
    # rather than failing on the packages that already landed.
    - name: Push to nuget.org
      run: >
        dotnet nuget push "${{ runner.temp }}/packages/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        --skip-duplicate
