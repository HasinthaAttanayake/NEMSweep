name: Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Test
      run: dotnet test --configuration Release

    # The schemas are generated from the same constants the validator enforces, so a committed copy
    # can fall behind them silently. Regenerating and diffing is what keeps the published contract
    # honest now that editors and language models are pointed at the file rather than the command.
    - name: Check committed schemas match the validator
      run: |
        set -euo pipefail
        fail() { echo "::error::schema/$1 is stale; regenerate it with --describe-schema $2"; exit 1; }
        dotnet run --project NEMSweep.CLI -c Release -- --describe-schema scenario > scenario.actual.json
        dotnet run --project NEMSweep.CLI -c Release -- --describe-schema sweep > sweep.actual.json
        diff -u schema/scenario-v5.json scenario.actual.json || fail scenario-v5.json scenario
        diff -u schema/sweep-v1.json sweep.actual.json || fail sweep-v1.json sweep

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools
      run: dotnet tool restore

    # Fails on a broken cross-reference or a TOC entry with no page behind it, so the docs site
    # cannot ship a dead link. Cloudflare Pages runs docs/build.sh, which invokes the same command.
    - name: Build documentation site
      run: dotnet docfx docs/docfx.json --warningsAsErrors

  # The image is described entirely by NEMSweep.CLI.csproj, so there is no Dockerfile to drift and
  # no daemon in the build. On a pull request it is built and thrown away, which is enough to catch
  # a broken image without publishing one; only main pushes a tag anyone could pull.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build image
      if: github.ref != 'refs/heads/main'
      run: >
        dotnet publish NEMSweep.CLI/NEMSweep.CLI.csproj -c Release --os linux --arch x64
        -t:PublishContainer
        -p:ContainerArchiveOutputPath=${{ runner.temp }}/nemsweep.tar.gz

    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Multi-architecture needs a registry: the SDK can write a single-architecture image to a local
    # archive, but composing the image index requires somewhere to push the manifests.
    - name: Publish image
      if: github.ref == 'refs/heads/main'
      run: >
        dotnet publish NEMSweep.CLI/NEMSweep.CLI.csproj -c Release
        -t:PublishContainer
        -p:ContainerRegistry=ghcr.io
        -p:ContainerRepository=${{ github.repository_owner }}/nemsweep
        -p:ContainerImageTags='"latest;${{ github.sha }}"'
